# تنبيه: السرّان SUPABASE_URL وSUPABASE_KEY يجب أن يشيرا إلى مشروع قاعدة البيانات الحالي (نفس js/config.js)،
# وإلا قد يتوقف المشروع الفعلي عن النشاط. المساعد الذكي له مشروعه الأصلي ويحتاج بقاءه نشطًا ما دام مستخدَمًا.
name: Supabase Keep Alive

"on":
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/subjects?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
